[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inttools"
version = "0.1.1"
description = "A beginner-friendly Python library for integer operations"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

authors = [
    { name = "Namra Acharya" }
]

keywords = [
    "integer",
    "integers",
    "math",
    "utilities",
    "python",
    "number"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/inttools"
Repository = "https://github.com/YOUR_USERNAME/inttools"
Issues = "https://github.com/YOUR_USERNAME/inttools/issues"